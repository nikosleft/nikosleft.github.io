<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - Nikos Lazaridis</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f0e; color: #f2f1ec; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 560px; padding: 32px; }
      h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1; letter-spacing: -0.05em; margin: 0 0 18px; }
      p { color: #a7aaa2; }
      a { color: #c9f56a; }
    </style>
    <script>
      (function () {
        var path = window.location.pathname;
        var match = path.match(/^\/demos\/(relayforge|slotline)\/(.*)$/);
        if (match) {
          var route = match[2].replace(/^\/+|\/+$/g, "");
          window.location.replace("/demos/" + match[1] + "/#/" + route + window.location.search);
          return;
        }
        window.setTimeout(function () {
          document.getElementById("fallback").hidden = false;
        }, 250);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found.</h1>
      <p>The address may be outdated, or the project may have moved.</p>
      <p id="fallback" hidden><a href="/">Return to the portfolio</a> or <a href="/projects">browse all projects</a>.</p>
      <noscript><p><a href="/">Return to the portfolio</a></p></noscript>
    </main>
  </body>
</html>
